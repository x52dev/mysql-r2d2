[package]
name = "mysql-r2d2"
version = "26.0.0"
authors = [
    "outersky <outersky@gmail.com>",
    "robjtede <robjtede@icloud.com>",
]
license = "MIT"
description = "MySQL support for the r2d2 connection pool"
repository = "https://github.com/x52dev/mysql-r2d2"
keywords = ["mysql", "sql", "pool", "database", "r2d2"]
edition = "2021"
rust-version = "1.81"

[dependencies]
r2d2 = "0.8.9"
mysql = { version = "26", default-features = false, features = ["minimal"] }
